<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Комната | PsyHelp</title>
    <link rel="stylesheet" href="../assets/css/theme.css">
    <link rel="stylesheet" href="../assets/css/room.css">
</head>
<body>
    <div class="room-layout">

        <!-- Верхняя панель -->
        <header class="room-topbar">
            <div class="room-info">
                <span class="room-status-dot" id="roomStatusDot"></span>
                <span class="room-status-text" id="roomStatus">Подключение...</span>
            </div>
            <div class="room-timer" id="roomTimer">00:00</div>
            <div class="room-actions">
                <button class="room-icon-btn" id="copyLinkBtn" title="Скопировать ссылку">🔗</button>
                <a class="room-leave-btn-top" id="leaveTopBtn" href="#">Выйти</a>
            </div>
        </header>

        <!-- Видео-область -->
        <main class="room-main">
            <!-- Чужое видео (главное) -->
            <div class="video-remote" id="videoRemote">
                <div class="video-avatar" id="remoteAvatar">?</div>
                <div class="video-name" id="remoteName">Собеседник</div>
                <div class="video-badge" id="remoteRole">Психолог</div>
                <div class="video-off" id="videoOffMessage">
                    <p>Видео собеседника появится здесь</p>
                    <small>Реальный видеочат подключается в следующих версиях</small>
                </div>
            </div>

            <!-- Своё видео (превью) -->
            <div class="video-local" id="videoLocal">
                <div class="video-local-off" id="localVideoOff">
                    <span>Камера выключена</span>
                </div>
                <div class="video-local-label">Вы</div>
            </div>
        </main>

        <!-- Нижняя панель управления -->
        <footer class="room-controls">
            <button class="control-btn" id="micBtn" title="Микрофон">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                    <line x1="12" y1="19" x2="12" y2="23"></line>
                    <line x1="8" y1="23" x2="16" y2="23"></line>
                </svg>
                <span class="control-label" id="micLabel">Микрофон</span>
            </button>

            <button class="control-btn" id="camBtn" title="Камера">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="23 7 16 12 23 17 23 7"></polygon>
                    <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                </svg>
                <span class="control-label" id="camLabel">Камера</span>
            </button>

            <button class="control-btn" id="chatBtn" title="Чат">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
                <span class="control-label">Чат</span>
            </button>

            <button class="control-btn control-btn-danger" id="leaveBtn" title="Завершить">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"></path>
                    <line x1="23" y1="1" x2="1" y2="23"></line>
                </svg>
                <span class="control-label">Завершить</span>
            </button>
        </footer>

    </div>

    <script>window.CURRENT_USER = window.CURRENT_USER || 'client';</script>
    <script src="../assets/js/room.js"></script>
</body>
</html>
