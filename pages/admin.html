<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Модерация | PsyHelp</title>
    <link rel="stylesheet" href="../assets/css/theme.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <link rel="stylesheet" href="../assets/css/user-menu.css">
    <link rel="stylesheet" href="../assets/css/admin.css">
    <link rel="stylesheet" href="../assets/css/notifications.css">
</head>
<body>
    <div class="dashboard-layout">

        <aside class="sidebar">
            <div class="logo">PsyHelp</div>
            <nav class="sidebar-nav">

                <a href="#" class="nav-item active" data-tab="applications">
                    <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    Заявки
                    <span class="nav-badge" id="appsBadge"></span>
                </a>

                <a href="#" class="nav-item" data-tab="tasks">
                    <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 11 12 14 22 4"></polyline>
                        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                    </svg>
                    Мои задачи
                    <span class="nav-badge" id="tasksBadge"></span>
                </a>

                <a href="#" class="nav-item" data-tab="decisions">
                    <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                        <polyline points="9 12 11 14 15 10"></polyline>
                    </svg>
                    Решения
                    <span class="nav-badge" id="decisionsBadge"></span>
                </a>

            </nav>
            <div class="role-switcher">
                <label>Просмотр как:</label>
                <select id="roleSelect">
                    <option value="owner">Собственник</option>
                    <option value="moderator">Модератор (тест)</option>
                </select>
            </div>
        </aside>

        <div class="main-wrapper">
            <header class="topbar">
                <h1 class="page-title" id="pageTitle">Заявки на роль психолога</h1>
                <div class="topbar-actions">
                    <button class="icon-btn" aria-label="Уведомления">🔔</button>
                </div>
            </header>

            <div class="content-row">
                <main class="main-content" id="mainContent"></main>
            </div>
        </div>
    </div>

    <!-- Модалка: Делегировать -->
    <div class="admin-modal-overlay" id="delegateModal">
        <div class="admin-modal">
            <div class="admin-modal-header">
                <h3>Делегировать заявку</h3>
                <button class="admin-modal-close" data-close="delegateModal">✕</button>
            </div>
            <div class="admin-modal-body" id="delegateBody"></div>
            <div class="admin-modal-actions">
                <button class="admin-btn admin-btn-cancel" data-close="delegateModal">Отмена</button>
                <button class="admin-btn admin-btn-approve" id="delegateConfirm">Назначить</button>
            </div>
        </div>
    </div>

    <!-- Модалка: Задача исполнителя -->
    <div class="admin-modal-overlay" id="taskModal">
        <div class="admin-modal">
            <div class="admin-modal-header">
                <h3 id="taskModalTitle">Задача</h3>
                <button class="admin-modal-close" data-close="taskModal">✕</button>
            </div>
            <div class="admin-modal-body" id="taskModalBody"></div>
            <div class="admin-modal-actions" id="taskModalActions"></div>
        </div>
    </div>

    <!-- Модалка: Финальное решение собственника -->
    <div class="admin-modal-overlay" id="decisionModal">
        <div class="admin-modal">
            <div class="admin-modal-header">
                <h3>Финальное решение</h3>
                <button class="admin-modal-close" data-close="decisionModal">✕</button>
            </div>
            <div class="admin-modal-body" id="decisionBody"></div>
            <div class="admin-modal-actions" id="decisionActions"></div>
        </div>
    </div>

    <script>window.CURRENT_USER = 'admin';</script>
    <script src="../assets/js/user-menu.js"></script>
    <script src="../assets/js/notifications.js"></script>
    <script src="../assets/js/checklist-templates.js"></script>
    <script src="../assets/js/admin.js"></script>
</body>
</html>
