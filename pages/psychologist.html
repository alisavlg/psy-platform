<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль психолога | PsyHelp</title>
    <link rel="stylesheet" href="../assets/css/theme.css">
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <link rel="stylesheet" href="../assets/css/calendar.css">
    <link rel="stylesheet" href="../assets/css/psychologist.css">
</head>
<body>
    <div class="dashboard-layout">

        <aside class="sidebar">
            <div class="logo">PsyHelp</div>
            <nav class="sidebar-nav">
                <a href="client.html?section=catalog" class="nav-item">
                    <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    Найти психолога
                </a>
                <a href="client.html?section=sessions" class="nav-item">
                    <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                    Мои сессии
                </a>
                <a href="client.html?section=messages" class="nav-item">
                    <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    Сообщения
                </a>
                <a href="client.html?section=planner" class="nav-item">
                    <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 11 12 14 22 4"></polyline>
                        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                    </svg>
                    Планировщик
                </a>
                <a href="client.html?section=profile" class="nav-item">
                    <svg class="nav-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    Профиль
                </a>
            </nav>
        </aside>

        <div class="main-wrapper">

            <header class="topbar">
                <a href="client.html?section=catalog" class="btn-back">← Назад к каталогу</a>
                <div class="topbar-actions">
                    <button class="icon-btn" aria-label="Уведомления">🔔</button>
                    <div class="user-avatar">К</div>
                </div>
            </header>

            <div class="content-row">
                <main class="main-content">
                    <div id="psychologistProfile">
                        <!-- Заполняется JS -->
                    </div>
                </main>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО БРОНИРОВАНИЯ -->
    <div class="modal-overlay" id="bookingModalOverlay">
        <div class="modal">
            <h3>Запись на сессию</h3>

            <div class="booking-summary" id="bookingSummary"></div>

            <div class="form-group">
                <label for="bookingClientName">Имя и отчество</label>
                <input type="text" id="bookingClientName" placeholder="Анна Сергеевна" required>
                <span class="form-error" id="bookingClientNameError"></span>
            </div>

            <div class="form-group">
                <label for="bookingTopic">Тема обращения</label>
                <input type="text" id="bookingTopic" placeholder="Например: Тревога, отношения">
            </div>

            <div class="modal-actions">
                <button class="btn-save" id="confirmBookingBtn">Забронировать</button>
                <button class="btn-cancel" id="cancelBookingBtn">Отмена</button>
            </div>
        </div>
    </div>

    <script>window.CURRENT_USER = 'client';</script>
    <script src="../assets/js/psychologist.js"></script>
</body>
</html>
